# Render blueprint for the API. The frontend goes to Vercel (see frontend/vercel.json)
# and the database to Supabase/Neon — set DATABASE_URL to that connection string.
#
# Two things Render will reject or trip over, and how this file handles them:
#
# 1. Disks require a paid instance type. A `disk:` block on `plan: free` fails
#    validation, so the disk below is commented out. On the free plan uploaded
#    files live on an ephemeral filesystem and are lost on every redeploy — the
#    database rows survive, the CSVs do not. Move to `plan: starter` and
#    uncomment the disk to keep them.
#
# 2. The service refuses to start in production if SECRET_KEY, ADMIN_PASSWORD or
#    CORS_ORIGINS are unsafe — it says which in the logs. Every `sync: false`
#    value below must be filled in on the Render dashboard before the first
#    deploy, or the health check fails and the deploy is marked failed.
services:
  - type: web
    name: ai-bi-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SQL_ECHO
        value: "false"
      - key: EXPOSE_API_DOCS
        value: "false"
      # Matches the Dockerfile default. Point this at /data/uploads only when a
      # disk is mounted; without one the path is ephemeral either way.
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: SECRET_KEY
        generateValue: true

      # --- fill these in on the dashboard; never commit them ----------------
      # Postgres connection string. A `postgres://` URI with `?sslmode=require`
      # is fine — the API rewrites it for the async driver on startup.
      - key: DATABASE_URL
        sync: false
      # At least 12 characters, or the service refuses to start.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Exact https origins, comma separated. Not "*", and not empty.
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # --- Supabase sign-in (optional) --------------------------------------
      # Set the first two and accounts move to Supabase; leave them empty and
      # the API keeps its own local admin account. SUPABASE_JWT_SECRET is only
      # needed for projects still issuing HS256 tokens.
      # Never put the service_role key in any of these.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Durable CSV/Excel uploads (private Storage bucket). Never put this in
      # the browser or in SUPABASE_ANON_KEY.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: datasets

    # Optional: local disk volume. Prefer Supabase Storage (above) on free tier.
    # disk:
    #   name: uploads
    #   mountPath: /data
    #   sizeGB: 1
